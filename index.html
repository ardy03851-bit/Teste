    @keyframes lgGlassSweep {
      0% { transform: translateX(-140%) skewX(-24deg); opacity: 0; }
      35% { opacity: 0.55; }
      70% { opacity: 0.55; }
      100% { transform: translateX(320%) skewX(-24deg); opacity: 0; }
    }
    @keyframes lgAmbientPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.03); }

    #liquid-glass-zip-hud .lg-shell {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 348px;
      padding: 13px 18px 13px 14px;
      border-radius: 999px;
      /* Deep smoked refractive glass with subtle top-down light dispersion */
      background:
        radial-gradient(120% 140% at 15% 0%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.02) 55%, rgba(12, 14, 18, 0.45) 100%),
        rgba(18, 20, 26, 0.68);
      backdrop-filter: blur(36px) saturate(190%) contrast(106%);
      -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(106%);
      /* Multi-layer specular rim & depth shadow */
      box-shadow:
        0 24px 54px -10px rgba(0, 0, 0, 0.62),
        0 4px 16px rgba(0, 0, 0, 0.32),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.48),
        inset 0 -1px 0.5px rgba(255, 255, 255, 0.12),
        inset 0 0 18px rgba(255, 255, 255, 0.05);
      border: 0.5px solid rgba(255, 255, 255, 0.24);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    /* Diagonal optical caustic reflection */
    #liquid-glass-zip-hud .lg-caustic {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 38%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      animation: lgGlassSweep 4.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    /* Precision SVG Circular Glass Gauge */
    #liquid-glass-zip-hud .lg-ring-wrap {

      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    #liquid-glass-zip-hud .lg-ring-glow {
      position: absolute;
      inset: -3px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(226, 232, 240, 0.25), transparent 70%);
      animation: lgAmbientPulse 2.4s infinite ease-in-out;
      pointer-events: none;
    }
    #liquid-glass-zip-hud svg.lg-svg {
      width: 38px;
      height: 38px;
      transform: rotate(-90deg);
      overflow: visible;
    }
    #liquid-glass-zip-hud circle.lg-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 2.5;
    }
    #liquid-glass-zip-hud circle.lg-arc {

      stroke: url(#lg-grad);
      stroke-width: 2.6;

      stroke-dasharray: 94.25;
      stroke-dashoffset: 92;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.45));
      transition: stroke-dashoffset 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #liquid-glass-zip-hud .lg-pct-mini {
